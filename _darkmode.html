<script>
  (function() {
    // Apply saved theme immediately to avoid flash
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.documentElement.classList.add('dark-mode-pending');
    }
  })();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Inject button into navbar right side
    const navbarRight = document.querySelector('.navbar-nav.ms-auto, .navbar-collapse .navbar-nav:last-child, #quarto-header .navbar-nav');
    const btn = document.createElement('button');
    btn.id = 'dark-mode-toggle';
    btn.setAttribute('aria-label', 'Toggle dark mode');

    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('dark-mode');
      btn.textContent = 'Light';
    } else {
      btn.textContent = 'Dark';
    }

    // Insert after the navbar icons
    const navbarCollapse = document.querySelector('.navbar-collapse');
    if (navbarCollapse) {
      navbarCollapse.appendChild(btn);
    } else {
      const navbar = document.querySelector('.navbar');
      if (navbar) navbar.appendChild(btn);
    }

    btn.addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      btn.textContent = isDark ? 'Light' : 'Dark';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  });
</script>
